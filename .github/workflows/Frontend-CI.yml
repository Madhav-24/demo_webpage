name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Build pull requests and main-branch changes in a clean Node environment.
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the exact revision that triggered this workflow.
      - name: Checkout code
        uses: actions/checkout@v4

      # Match the project runtime and reuse npm's dependency cache.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Install from the lockfile to make CI dependency resolution reproducible.
      - name: Install dependencies
        run: npm ci

      # Type-check and bundle the production application.
      - name: Lint application
        run: npm run lint

      - name: Build React application
        run: npm run build